<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>金融推理局｜特别调查档案</title>
<style>
:root{
  --bg:#080f1c;--panel:#111e30;--panel2:#17273c;--line:#2a405b;
  --blue:#55c8ff;--cyan:#72e0df;--gold:#f5c66b;--red:#ff7c83;
  --green:#7de0b0;--text:#edf5ff;--muted:#9aadc4;
}
*{box-sizing:border-box}
body{
  margin:0;color:var(--text);font-family:Inter,"Microsoft YaHei",Arial,sans-serif;
  background:
    radial-gradient(ellipse at 15% 0%,#173354 0,transparent 38%),
    radial-gradient(ellipse at 100% 60%,#142b3d 0,transparent 34%),var(--bg);
  min-height:100vh;line-height:1.65;
}
button{font:inherit;cursor:pointer}
.shell{max-width:1000px;margin:auto;padding:18px 17px 55px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #263950;padding:7px 0 17px}
.brand{display:flex;align-items:center;gap:11px}
.logo{
 width:40px;height:40px;border:1px solid #4c83a5;border-radius:12px;
 display:grid;place-items:center;color:var(--cyan);font-size:22px;
 background:linear-gradient(145deg,#183d59,#102338);box-shadow:0 0 22px #43bde522;
}
.brandname{font-weight:900;letter-spacing:2px;font-size:17px}
.brandsub{font-size:10px;color:var(--muted);letter-spacing:2px}
.topright{text-align:right;color:var(--muted);font-size:11px}
.live{color:var(--green);font-size:11px}
.live:before{content:"";display:inline-block;width:6px;height:6px;background:var(--green);border-radius:50%;margin-right:6px;vertical-align:middle;box-shadow:0 0 8px var(--green)}
.progressbox{display:flex;align-items:center;gap:12px;margin:18px 0 22px}
.progress{height:5px;flex:1;background:#1d3045;border-radius:10px;overflow:hidden}
.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:.4s}
.progresslabel{font-size:11px;color:var(--muted);white-space:nowrap}
.screen{animation:appear .35s ease}
@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{
 position:relative;overflow:hidden;border:1px solid #34536f;border-radius:22px;
 padding:clamp(23px,5vw,46px);
 background:linear-gradient(125deg,#172f49 0%,#112237 55%,#132b3a 100%);
 box-shadow:0 20px 60px #0005;
}
.hero:after{
 content:"";position:absolute;width:280px;height:280px;border:1px solid #5bc9e522;
 border-radius:50%;right:-80px;top:-100px;box-shadow:0 0 0 28px #5bc9e20a,0 0 0 58px #5bc9e208;
}
.eyebrow{font-size:11px;letter-spacing:3px;color:var(--cyan);font-weight:800}
h1{font-size:clamp(30px,6vw,48px);line-height:1.2;margin:14px 0}
h2{font-size:23px;line-height:1.35;margin:5px 0 12px}
h3{font-size:16px;margin:0 0 7px}
p{color:#c1cede;margin:8px 0}
.muted{color:var(--muted);font-size:13px}
.panel{
 background:linear-gradient(145deg,#14243a,#101c2d);border:1px solid var(--line);
 border-radius:17px;padding:21px;margin:15px 0;box-shadow:0 12px 30px #0002;
}
.panelhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}
.tag{font-size:10px;letter-spacing:1px;color:var(--cyan);border:1px solid #37617a;border-radius:30px;padding:4px 9px}
.notice{padding:13px 15px;background:#173348;border-left:3px solid var(--blue);border-radius:8px;font-size:13px;color:#d7e8f7;margin:15px 0}
.notice.gold{background:#392f20;border-color:var(--gold)}
.notice.green{background:#16382f;border-color:var(--green)}
.notice.red{background:#3a252d;border-color:var(--red)}
.btn{
 display:inline-flex;justify-content:center;align-items:center;gap:8px;
 padding:12px 19px;border:1px solid #5bbde0;border-radius:10px;
 color:#071927;background:linear-gradient(110deg,#64d3f6,#73e0d9);
 font-weight:800;font-size:14px;transition:.2s;margin:5px 5px 5px 0;
}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 7px 22px #4ac5e533}
.btn.secondary{background:#1b3048;color:#dbeafa;border-color:#405b77}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
.choice{
 width:100%;display:flex;text-align:left;align-items:flex-start;gap:12px;
 border:1px solid #344b66;background:#172940;color:var(--text);
 border-radius:12px;padding:14px;margin:9px 0;transition:.2s;
}
.choice:hover{border-color:#64bfe0;background:#1b354e}
.choice.selected{border-color:var(--blue);background:#153d55;box-shadow:inset 0 0 0 1px #55c8ff55}
.choice .letter{
 flex:0 0 27px;width:27px;height:27px;border-radius:8px;background:#29425b;
 display:grid;place-items:center;color:var(--cyan);font-size:12px;font-weight:bold;
}
.choice strong{display:block;font-size:14px}
.choice small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.clue{
 background:linear-gradient(145deg,#1a2c43,#142236);border:1px solid #344b65;
 border-radius:13px;padding:15px;min-height:140px;display:flex;flex-direction:column;
}
.clue.opened{border-color:#5bb9d8}
.clue .cluetop{display:flex;justify-content:space-between;gap:8px;align-items:center}
.clue .stamp{font-size:10px;color:var(--gold);letter-spacing:1px}
.clue p{font-size:13px}
.clue button{margin-top:auto;align-self:flex-start}
.metricgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.metric{
 padding:16px;border:1px solid #344c65;background:#172a40;border-radius:14px;
 cursor:pointer;transition:.2s;min-height:145px;
}
.metric:hover{transform:translateY(-2px);border-color:#58bce0}
.metric.viewed{border-color:#65cbbd;background:#173446}
.metric .value{font-size:25px;font-weight:900;color:var(--cyan);margin:7px 0}
.metric .unit{font-size:11px;color:var(--muted)}
.metric .desc{font-size:12px;color:#c1cede;margin-top:9px}
.counter{font-size:12px;color:var(--muted)}
.bigquote{font-size:19px;color:#edf7ff;font-weight:700;line-height:1.6}
.scorecircle{
 width:145px;height:145px;border-radius:50%;display:grid;place-items:center;
 background:radial-gradient(circle at center,#14263a 58%,transparent 60%),conic-gradient(var(--cyan) var(--angle),#2b4056 0);
 margin:15px auto;border:1px solid #395a72;
}
.scorecircle strong{font-size:42px;display:block;text-align:center;line-height:1.1}
.scorecircle span{font-size:11px;color:var(--muted)}
.scoreitem{padding:13px 0;border-bottom:1px solid #2a3d53}
.scoretop{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.track{height:7px;border-radius:8px;background:#2b3e54;margin-top:8px;overflow:hidden}
.track span{display:block;height:100%;background:linear-gradient(90deg,#4aaedb,#71e0ce);border-radius:8px}
.resultcard{border:1px solid #3c6177;background:linear-gradient(135deg,#17374b,#17283e);padding:19px;border-radius:15px;margin:14px 0}
.resultcard h3{color:var(--cyan)}
.resulttitle{font-size:25px;font-weight:900;color:#f0f8ff}
.resultsection{margin:17px 0}
.resultsection h3{color:var(--gold);font-size:14px}
.resultsection p{font-size:13px}
hr{border:0;border-top:1px solid #2b4057;margin:19px 0}
.hidden{display:none!important}
.footer{text-align:center;color:#71859d;font-size:11px;margin-top:25px}
@media(max-width:620px){
 .grid,.metricgrid{grid-template-columns:1fr}
 .topright{font-size:10px}
 .panel{padding:16px}
 .hero{padding:25px 20px}
}
</style>
</head>
<body>
<div class="shell">
<header class="topbar">
 <div class="brand">
  <div class="logo">⌕</div>
  <div><div class="brandname">金融推理局</div><div class="brandsub">FINANCIAL INTELLIGENCE BUREAU</div></div>
 </div>
 <div class="topright"><div class="live">调查系统运行中</div><div>CASE FILE · HX-027</div></div>
</header>
<div class="progressbox">
 <div class="progress"><div id="progress"></div></div>
 <div class="progresslabel" id="progressLabel">任务准备中</div>
</div>
<main id="app" class="screen"></main>
<div class="footer">模拟企业与情境均为虚构内容｜本实验仅用于投资教育研究，不构成投资建议</div>
</div>

<script>
const app=document.getElementById("app");
const progressEl=document.getElementById("progress");

const progressLabel=document.getElementById("progressLabel");

// ===== Supabase 云端连接配置 =====
// 请将下面两项替换为你自己的 Supabase 项目地址和 Legacy anon public key。
// 只能使用 anon public key，绝对不要填写 service_role / secret key。
const SUPABASE_URL = "https://izofdngfczaxlqmnmfal.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6b2ZkbmdmY3pheGxxbW5tZmFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwNzc1NTMsImV4cCI6MjEwODY1MzU1M30.yWtR8ryfAHiZPyOXiKg9PGt9KRhJAyZx2x266MQ1BLc";

let cloudUploading = false;

function cloudConfigured(){
 return SUPABASE_URL.startsWith("https://") &&
        !SUPABASE_URL.includes("在这里填写") &&
        SUPABASE_ANON_KEY.length > 30 &&
        !SUPABASE_ANON_KEY.includes("在这里填写");
}

async function syncToCloud(){
 const status=document.getElementById("cloudStatus");
 const retry=document.getElementById("retryUpload");
 if(!status) return;

 if(!cloudConfigured()){
  status.textContent="本机记录已保存｜等待配置 Supabase 地址和 anon 公钥";
  status.className="notice gold";
  if(retry) retry.classList.remove("hidden");
  return;
 }
 if(cloudUploading) return;
 if(S.cloud_sync==="success"){
  status.textContent="云端同步成功｜实验记录已进入研究后台";
  status.className="notice green";
  if(retry) retry.classList.add("hidden");
  return;
 }

 cloudUploading=true;
 status.textContent="正在安全提交实验记录……";
 status.className="notice";
 if(retry) retry.disabled=true;

 try{
  const payload={
   session_id:S.id,
   answers:{
    ...S.answers,
    _raw_scores:S.scores,
    _events:S.events,
    _interpretation:S.interpretation,
    _result_profile:S.result_profile
   },
   total_score:S.total,
   dimension_scores:S.dimension_scores || {},
   completed_at:S.ended || new Date().toISOString(),
   duration_seconds:S.duration_seconds
  };

  const response=await fetch(
   SUPABASE_URL.replace(/\/$/,"")+"/functions/v1/save-financial-reasoning",
   {
    method:"POST",
    headers:{
     "Content-Type":"application/json",
     "apikey":SUPABASE_ANON_KEY,
     "Authorization":"Bearer "+SUPABASE_ANON_KEY
    },
    body:JSON.stringify(payload)
   }
  );

  const result=await response.json().catch(()=>({}));
  if(!response.ok || result.success!==true){
   throw new Error(result.message || ("HTTP "+response.status));
  }

  S.cloud_sync="success";
  S.cloud_record_id=result.record_id;
  S.cloud_synced_at=new Date().toISOString();
  localStorage.setItem("FI_CASE_"+S.id,JSON.stringify(S));
  status.textContent="云端同步成功｜实验记录已进入研究后台（记录编号："+result.record_id+"）";
  status.className="notice green";
  if(retry) retry.classList.add("hidden");
 }catch(error){
  S.cloud_sync="failed";
  S.cloud_error=String(error.message || error);
  localStorage.setItem("FI_CASE_"+S.id,JSON.stringify(S));
  status.textContent="云端同步失败｜本机记录仍已保存。请检查网络或配置后点击重试。";
  status.className="notice red";
  if(retry){
   retry.disabled=false;
   retry.classList.remove("hidden");
  }
  console.error("金融推理局云端同步失败：",error);
 }finally{
  cloudUploading=false;
 }
}

const S={
 id:"HX"+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,6).toUpperCase(),
 started:new Date().toISOString(),
 ended:null,
 duration_seconds:0,
 answers:{},
 scores:{},
 events:[],
 total:0
};
function event(type,value){
 S.events.push({type,value,time:new Date().toISOString()});
}
function bar(n,label){
 progressEl.style.width=n+"%";
 progressLabel.textContent=label;
}
function page(html){
 app.innerHTML=html;
 app.classList.remove("screen");
 void app.offsetWidth;
 app.classList.add("screen");
  window.scrollTo({top:0,behavior:"smooth"});
}
function btn(id,fn){
 const el=document.getElementById(id);
 if(el)el.onclick=fn;
}
function single(id,callback){
 const box=document.getElementById(id);
 box.querySelectorAll(".choice").forEach(el=>{
  el.onclick=()=>{
   box.querySelectorAll(".choice").forEach(x=>x.classList.remove("selected"));
   el.classList.add("selected");
   callback(el.dataset.v);
  };
 });
}
function multi(id,max,callback){
 const box=document.getElementById(id);
 let chosen=[];
 box.querySelectorAll(".choice").forEach(el=>{
  el.onclick=()=>{
   const v=el.dataset.v;
   if(chosen.includes(v))chosen=chosen.filter(x=>x!==v);
   else if(chosen.length<max)chosen.push(v);
   el.classList.toggle("selected",chosen.includes(v));
   callback([...chosen]);
  };
 });
}
function options(items){
 return items.map((x,i)=>`
 <button class="choice" data-v="${x.v}">
  <span class="letter">${String.fromCharCode(65+i)}</span>
  <span><strong>${x.t}</strong>${x.d?`<small>${x.d}</small>`:""}</span>
 </button>`).join("");
}
function start(){
 bar(2,"案件载入");
 page(`
 <section class="hero">
  <div class="eyebrow">SPECIAL INVESTIGATION · 027</div>
  <h1>一份看似漂亮的<br>企业成绩单</h1>
  <p>一家正在扩张的科技企业，收入增长、订单增加，市场情绪高涨。但几份内部材料，却透露出不太一样的信号。</p>
  <div class="notice">你的任务不是猜涨跌，而是像调查员一样：识别信息、追踪证据、判断风险，并在新证据出现时重新思考。</div>
  <button class="btn" id="start">接受调查任务　→</button>
 </section>
 <div class="panel">
  <div class="panelhead"><h3>案件资料</h3><span class="tag">虚构案例</span></div>
  <div class="grid">
   <div><div class="muted">调查对象</div><b>HX科技</b></div>
   <div><div class="muted">案件类型</div><b>经营质量核查</b></div>
   <div><div class="muted">预计用时</div><b>6—10分钟</b></div>
   <div><div class="muted">调查模式</div><b>独立判断</b></div>
  </div>
  <p class="muted">全程无需注册或填写个人身份信息。你的操作将保存在当前浏览器，可在结束后导出。</p>
 </div>`);
 btn("start",pretest);
}
function pretest(){
 bar(8,"初始判断");
 page(`
 <div class="panel">
  <div class="eyebrow">STAGE 00 / FIRST IMPRESSION</div>
  <h2>调查开始前：先记录你的直觉</h2>
  <p>你刚收到一条简短的市场消息：</p>
  <div class="resultcard">
   <span class="tag">市场快讯</span>
   <div class="bigquote">“HX科技今年新业务订单增长明显，市场关注度持续上升。”</div>
   <p class="muted">目前没有其他财务资料或项目进度信息。</p>
  </div>
  <h3>仅根据这条消息，你目前对企业的初步态度是？</h3>
  <div id="initial">${options([
   {v:"positive",t:"偏积极",d:"愿意进一步了解，初步看好"},
   {v:"neutral",t:"暂时观望",d:"信息太少，暂时不形成倾向"},
   {v:"negative",t:"偏谨慎",d:"对市场热度和订单增长保持警惕"}
  ])}</div>
  <hr>
  <h3>你对这个初步判断有多大把握？</h3>
  <div id="confidence">${options([
   {v:"1",t:"很低",d:"目前几乎没有判断依据"},
   {v:"2",t:"较低"},{v:"3",t:"一般"},{v:"4",t:"较高"},{v:"5",t:"很高",d:"我认为这条消息已经足够说明问题"}
  ])}</div>
  <button class="btn" id="next" disabled>锁定初始判断</button>
 </div>`);
 let a="",c="";
 single("initial",v=>{a=v;check()});
 single("confidence",v=>{c=v;check()});
 function check(){document.getElementById("next").disabled=!(a&&c)}
 btn("next",()=>{
  S.answers.initial={judgment:a,confidence:Number(c)};
  event("initial_judgment",S.answers.initial);
  cluesStage();
 });
}
const clues=[
 {id:"official",name:"企业公告",source:"企业官方披露",time:"昨天 18:30",body:"HX科技披露：新业务订单金额同比增长约40%，目前已签署部分框架协议。公告同时说明，部分订单仍需根据客户实际需求分批交付。",kind:"事实中含有条件",hint:"公告来自企业官方渠道，但框架协议与已完成交付并不是一回事。"},
 {id:"media",name:"财经自媒体",source:"财经观察账号",time:"今天 08:15",body:"作者引用订单增长数据，认为HX科技有望迎来业绩拐点，并提到公司近期获得多家机构关注。文章没有展示完整的盈利预测依据。",kind:"数据与观点混合",hint:"引用真实数据不代表后续预测也已经得到证明。"},
 {id:"chat",name:"投资群截图",source:"匿名群聊转发",time:"今天 09:02",body:"截图称：某客户可能推迟验收，项目交付存在变数。截图没有客户名称，也没有原始文件。",kind:"未核实线索",hint:"匿名信息不能直接作为事实，但也可以成为进一步核查的线索。"},
 {id:"ai",name:"AI分析摘要",source:"智能分析工具",time:"今天 09:20",body:"AI总结称企业盈利能力持续改善，并引用了一组两年前的毛利率数据。摘要没有注明数据更新时间，也没有附上原始链接。",kind:"辅助分析材料",hint:"AI可能整理了真实材料，但数据过期会让结论失去时效性。"}
];
let opened=[];
let clueClass={};
function cluesStage(){
 bar(19,"第一关 · 信息审查");
 opened=[];clueClass={};
 clueScreen();
}
function clueScreen(){
 page(`
 <div class="panel">
  <div class="eyebrow">STAGE 01 / SOURCE INTELLIGENCE</div>
  <div class="panelhead"><h2>线索审查室</h2><span class="tag">01 / 04</span></div>
  <p>调查桌上有四份材料。它们并非简单的“真”或“假”——有些包含真实数据，有些夹杂推测，还有些可能值得核查。</p>
  <div class="grid" id="clueGrid"></div>
  <div class="notice">点击材料查看详情。读完后，你需要决定优先核查哪一条线索。</div>
  <div class="muted">已查看 <b id="openedCount">0</b> / 4 份材料</div>
  <button class="btn" id="next" disabled>进入线索判断 →</button>
 </div>`);
 const grid=document.getElementById("clueGrid");
 clues.forEach(c=>{
  const el=document.createElement("div");
  el.className="clue";
  el.innerHTML=`
   <div class="cluetop"><span class="stamp">EVIDENCE ${c.id.toUpperCase()}</span><span class="tag">${c.source}</span></div>
   <h3>${c.name}</h3><p class="muted">${c.time}</p>
   <button class="btn secondary">打开档案</button>
   <div class="hidden detail"><hr><p>${c.body}</p><p class="muted">材料性质：${c.kind}</p><p class="muted">调查提示：${c.hint}</p></div>`;
  el.querySelector("button").onclick=()=>{
   el.querySelector(".detail").classList.toggle("hidden");
   el.classList.add("opened");
   if(!opened.includes(c.id)){
    opened.push(c.id);event("clue_opened",c.id);
    document.getElementById("openedCount").textContent=opened.length;
   }
   document.getElementById("next").disabled=opened.length<2;
  };
  grid.appendChild(el);
 });
 btn("next",sourceStage);
}
function sourceStage(){
 bar(27,"第一关 · 线索判断");
 page(`
 <div class="panel">
  <div class="eyebrow">SOURCE PRIORITY</div>
  <h2>如果只能先核查一件事</h2>
  <p>目前你已经看过材料。调查时间有限，你会优先采取哪一步？</p>
  <div id="source">${options([
   {v:"announcement",t:"核对框架协议的具体内容",d:"确认订单是否具有约束力、交付条件是什么"},

  <h3>一、能力雷达档案</h3>
  ${scoreHtml}
  <div class="resultsection">
   <h3>二、你的调查优势</h3>
   <p>${p.bestText[p.best]}</p>
   <p class="muted">本次相对突出维度：${p.names[p.best]}</p>
  </div>
  <div class="resultsection">
   <h3>三、下一步值得加强的地方</h3>
   <p>${p.weakText[p.weak]}</p>
   <p class="muted">本次相对薄弱维度：${p.names[p.weak]}</p>
  </div>
  <div class="resultsection">
   <h3>四、你的关键选择说明</h3>
   <p><b>优先核查：</b>${sourceText[S.answers.source_priority]}</p>
   <p><b>财务线索：</b>${financialText[finLevel]}</p>
   <p><b>突发事件：</b>${actionText[S.answers.action]}</p>
   <p><b>AI报告：</b>${aiNarrative}</p>
  </div>
  <div class="resultcard">
   <h3>给你的下一次调查建议</h3>
   <p>${p.weak==="financial"?"遇到企业利润增长时，别急着形成结论。先查看经营现金流、应收账款和毛利率，弄清利润是否真正转化为现金。":
   p.weak==="information"?"面对一条吸引人的市场消息，先找原始公告、确认发布时间，再判断其中哪些是事实、哪些只是预测。":
   p.weak==="adjustment"?"新证据出现时，不必立刻推翻原判断。可以先写下原先依据，再比较新信息是否改变了证据链。":
   "使用AI分析时，先检查它引用了什么数据、数据有多新，再决定是否采纳它的解释。"}
   </p>
  </div>
  <div class="resultsection">
   <h3>五、本次调查记录</h3>
   <p class="muted">调查编号：${S.id}<br>体验时长：${S.duration_seconds}秒<br>查看线索：${opened.length}份<br>查看财务指标：${(S.answers.metrics_viewed||[]).length}项</p>
  </div>
  <div class="notice gold">研究说明：分数用于描述参与者在本次情境任务中的表现。它不能直接说明参与者现实中是否应该投资，也不能替代专业投资适当性评估。</div>
  <div id="cloudStatus" class="notice gold">本机记录已保存｜准备检查云端连接</div>
  <button class="btn secondary hidden" id="retryUpload">重试云端同步</button>
  <button class="btn" id="download">导出完整调查数据 JSON</button>
  <button class="btn secondary" id="again">重新体验</button>
 </div>`);
 btn("download",download);
 btn("again",()=>location.reload());
 btn("retryUpload",syncToCloud);
 syncToCloud();
}
function download(){
 const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json;charset=utf-8"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;a.download="金融推理局_"+S.id+".json";
 document.body.appendChild(a);a.click();a.remove();
 URL.revokeObjectURL(url);
}
start();
</script>
</body>
