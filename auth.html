
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#438BEF">
<title>登录 / 注册｜知投实验室</title>
<style>
:root{
  --blue:#438BEF;
  --blue-light:#EAF3FF;
  --orange:#FF795E;
  --bg:#F5F8FC;
  --text:#26364B;
  --muted:#8290A3;
  --border:#E9EEF5;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  font-family:"Microsoft YaHei",Arial,sans-serif;
  background:
    radial-gradient(circle at 15% 15%,#EAF3FF 0,transparent 35%),
    radial-gradient(circle at 90% 85%,#FFF0E9 0,transparent 35%),
    var(--bg);
  color:var(--text);
}
.home{
  position:fixed;
  top:22px;
  left:22px;
  color:var(--blue);
  text-decoration:none;
  font-size:14px;
  font-weight:bold;
  background:white;
  padding:11px 16px;
  border-radius:11px;
  box-shadow:0 4px 15px #31558212;
}
.container{
  width:100%;
  max-width:430px;
  background:white;
  border:1px solid var(--border);
  border-radius:22px;
  padding:35px;
  box-shadow:0 15px 45px #31558212;
}
.brand{text-align:center;margin-bottom:27px}
.logo{
  width:55px;height:55px;
  margin:auto;
  display:grid;place-items:center;
  color:white;font-size:27px;font-weight:bold;
  border-radius:17px;
  background:linear-gradient(135deg,#438BEF,#70B7FF);
  box-shadow:0 6px 15px #438bef35;
}
.brand h1{font-size:22px;margin:14px 0 6px}
.brand p{font-size:12px;color:var(--muted);margin:0}
.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  padding:5px;
  background:#F3F6FA;
  border-radius:11px;
  margin-bottom:24px;
}
.tab{
  border:0;
  padding:11px;
  border-radius:8px;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  font-weight:bold;
}
.tab.active{
  background:white;
  color:var(--blue);
  box-shadow:0 2px 8px #31558212;
}
.field{margin-bottom:17px}
label{
  display:block;
  font-size:12px;
  font-weight:bold;
  margin-bottom:8px;
}
input{
  width:100%;
  height:46px;
  padding:0 13px;
  border:1px solid var(--border);
  border-radius:10px;
  outline:none;
  font-size:14px;
  color:var(--text);
  background:#FCFDFF;
}
input:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px #438bef18;
}
.submit{
  width:100%;
  height:47px;
  border:0;
  border-radius:10px;
  background:linear-gradient(100deg,#438BEF,#3479E8);
  color:white;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
  margin-top:5px;
}
.submit:disabled{opacity:.6;cursor:wait}
.extra{
  display:flex;
  justify-content:flex-end;
  margin:13px 0;
}
.extra button{
  border:0;background:none;
  color:var(--blue);
  font-size:12px;
  cursor:pointer;
}
.message{
  display:none;
  padding:12px;
  border-radius:9px;
  font-size:12px;
  line-height:1.7;
  margin:15px 0;
  word-break:break-word;
}
.message.show{display:block}
.message.success{background:#E8F8F1;color:#23856C}
.message.error{background:#FFF0EC;color:#C65B46}
.tip{
  margin-top:22px;
  padding:13px;
  border-radius:10px;
  background:#FFF8F3;
  color:#9B806F;
  font-size:10px;
  line-height:1.8;
}
.footer{
  text-align:center;
  margin-top:22px;
  font-size:11px;
  color:#A1ACBA;
}
@media(max-width:480px){
  body{padding:16px}
  .container{padding:26px 21px}
  .home{top:12px;left:12px}
}
</style>
</head>
<body>

<a class="home" href="index.html">← 返回知投实验室</a>

<div class="container">
  <div class="brand">
    <div class="logo">知</div>
    <h1>欢迎来到知投实验室</h1>
    <p>投资可以不盲目，学习可以更有趣。</p>
  </div>

  <div class="tabs">
    <button class="tab active" id="loginTab" type="button">登录</button>
    <button class="tab" id="registerTab" type="button">注册账号</button>
  </div>

  <form id="authForm">
    <div class="field">
      <label for="email">邮箱地址</label>
      <input id="email" type="email" placeholder="请输入常用邮箱" autocomplete="email" required>
    </div>

    <div class="field">
      <label for="password">密码</label>
      <input id="password" type="password" placeholder="请输入密码（至少6位）" autocomplete="current-password" minlength="6" required>
    </div>

    <div class="extra" id="forgotArea">
      <button type="button" id="forgotBtn">忘记密码？</button>
    </div>

    <button class="submit" id="submitBtn" type="submit">登录</button>
  </form>

  <div class="message" id="message" role="status" aria-live="polite"></div>

  <div class="tip">
    知投实验室是大学生投资学习与风险教育平台。平台提供学习和模拟体验，不涉及真实证券交易，也不构成个性化投资建议。
  </div>

  <div class="footer">© 知投实验室 · SMART INVESTMENT LEARNING</div>
</div>

<script type="module">
import { createClient } from
  "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL =
  "https://izofdngfczaxlqmnmfal.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_zR4Na1A9PjvS8DjbJzDLag_t8FXCiH-";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const loginTab = document.getElementById("loginTab");
const registerTab = document.getElementById("registerTab");
const authForm = document.getElementById("authForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const submitBtn = document.getElementById("submitBtn");
const forgotBtn = document.getElementById("forgotBtn");
const forgotArea = document.getElementById("forgotArea");
const message = document.getElementById("message");

let mode = "login";

function showMessage(text, type = "success"){
  message.textContent = text;
  message.className = "message show " + type;
}

function switchMode(nextMode){
  mode = nextMode;

  loginTab.classList.toggle("active", mode === "login");
  registerTab.classList.toggle("active", mode === "register");

  submitBtn.textContent =
    mode === "login" ? "登录" : "创建账号";

  forgotArea.style.display =
    mode === "login" ? "flex" : "none";

  passwordInput.autocomplete =
    mode === "login" ? "current-password" : "new-password";

  message.className = "message";
}

loginTab.addEventListener("click", () => switchMode("login"));
registerTab.addEventListener("click", () => switchMode("register"));

authForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if(password.length < 6){
    showMessage("密码至少需要6位。", "error");
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "请稍候…";
  message.className = "message";

  try{
    if(mode === "register"){
      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options:{
          emailRedirectTo: window.location.origin +
            window.location.pathname.replace(/[^/]*$/, "index.html")
        }
      });

      if(error) throw error;

      if(data.session){
        showMessage("注册成功！正在进入知投实验室…");
        setTimeout(() => {
          window.location.href = "index.html";
        }, 1200);
      }else{
        showMessage(
          "注册申请已提交！请前往邮箱点击验证链接，验证成功后即可登录。"
        );
      }

    }else{
      const { error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if(error) throw error;

      showMessage("登录成功！正在返回知投实验室…");

      setTimeout(() => {
        window.location.href = "index.html";
      }, 900);
    }

  }catch(error){
    let errorText = error.message || "操作失败，请稍后重试。";

    if(errorText.toLowerCase().includes("invalid login")){
      errorText = "邮箱或密码不正确，请检查后重试。";
    }else if(errorText.toLowerCase().includes("already registered")){
      errorText = "这个邮箱已经注册，请直接登录。";
    }else if(errorText.toLowerCase().includes("password")){
      errorText = "密码不符合要求，请检查密码长度。";
    }

    showMessage(errorText, "error");

  }finally{
    submitBtn.disabled = false;
    submitBtn.textContent =
      mode === "login" ? "登录" : "创建账号";
  }
});

forgotBtn.addEventListener("click", async () => {
  const email = emailInput.value.trim();

  if(!email){
    showMessage("请先填写邮箱地址，再申请重置密码。", "error");
    return;
  }

  try{
    const { error } = await supabase.auth.resetPasswordForEmail(
      email,
      {
        redirectTo: window.location.origin +
          window.location.pathname.replace(/[^/]*$/, "auth.html")
      }
    );

    if(error) throw error;

    showMessage("密码重置邮件已发送，请检查邮箱（包括垃圾邮件文件夹）。");

  }catch(error){
    showMessage(error.message || "发送失败，请稍后重试。", "error");
  }
});

// 已登录用户访问登录页时，提供返回首页的入口
const { data: { session } } = await supabase.auth.getSession();

if(session){
  showMessage("你已经登录，可以返回知投实验室首页。");
}
</script>
</body>
</html>
